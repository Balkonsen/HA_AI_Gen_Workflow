[project]
name = "haco"
version = "0.1.0"
description = "Local-network Home Assistant config optimizer - connect over SSH, review optimizations, apply safely."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncssh>=2.17",
    "ruamel.yaml>=0.18",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13",
    "tomli-w>=1.0",
]

[project.scripts]
haco = "haco.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/haco"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "black>=24.8",
    "mypy>=1.11",
]

[tool.black]
line-length = 120
target-version = ["py312"]
extend-exclude = '''
/(
  bin
)/
'''

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["bin"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
