# Pre-commit Configuration for HA AI Gen Workflow
# Automatically validates code before commits

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--allow-multiple-documents"]
        exclude: '^1\.prompt\.yml$'
      - id: check-json
        exclude: '^\.vscode/launch\.json$'
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: detect-private-key
      - id: mixed-line-ending

  # Python code formatting
  - repo: https://github.com/psf/black
    rev: 23.11.0
    hooks:
      - id: black
        language_version: python3
        args: ["--line-length=120"]

  # Python linting
  - repo: https://github.com/PyCQA/flake8
    rev: 6.1.0
    hooks:
      - id: flake8
        args: ["--max-line-length=120", "--ignore=E203,W503"]

  # Python security checks
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.5
    hooks:
      - id: bandit
        args: ["-ll", "-i", "-x", "tests/"]
        additional_dependencies: ["pbr"]

  # Shell script validation
  # YAML linting
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.33.0
    hooks:
      - id: yamllint
        args:
          [
            "-d",
            "{extends: default, rules: {line-length: disable, document-start: disable, new-lines: disable, truthy: disable, brackets: disable, comments-indentation: disable}}",
          ]
        exclude: '^1\.prompt\.yml$'

  # Markdown linting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.38.0
    hooks:
      - id: markdownlint
        args: ["--fix"]

  # Local hooks for custom validation
  - repo: local
    hooks:
      - id: pytest-check
        name: pytest
        entry: pytest
        language: system
        pass_filenames: false
        always_run: true
        args: ["-v", "--tb=short", "-x"]
        stages: [pre-commit]

      - id: validate-shell-scripts
        name: Validate Shell Scripts
        entry: bash tests/validate_shell_scripts.sh
        language: system
        pass_filenames: false
        files: \.sh$
        stages: [pre-commit]
