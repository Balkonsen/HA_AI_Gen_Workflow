name: Lessons Learned Analysis

# Runs after each PR merge to analyze coding results and apply improvements
on:
  pull_request:
    types: [closed]
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      scan_only:
        description: 'Only scan repository (no PR analysis)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  pull-requests: read

jobs:
  analyze:
    name: Post-PR Lessons Learned
    runs-on: ubuntu-latest
    # Only run when a PR is merged (not just closed) or on manual dispatch
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true)

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # For PR events, checkout the target branch (e.g. main) not the merge ref,
          # so that 'git push' pushes to the correct branch.
          ref: ${{ github.event.pull_request.base.ref || github.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect PR Diff
        if: github.event_name == 'pull_request'
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          BASE_SHA=${{ github.event.pull_request.base.sha }}
          HEAD_SHA=${{ github.event.pull_request.head.sha }}
          git diff "${BASE_SHA}..${HEAD_SHA}" > /tmp/pr_diff.txt || true
          echo "PR_NUMBER=${PR_NUMBER}" >> $GITHUB_ENV
          echo "DIFF_FILE=/tmp/pr_diff.txt" >> $GITHUB_ENV

      - name: Run Tests and Capture Output
        if: github.event_name == 'pull_request'
        run: |
          pip install -r requirements-test.txt
          pytest tests/ -v --no-cov --tb=short 2>&1 | tee /tmp/test_output.txt || true
          echo "TEST_OUTPUT_FILE=/tmp/test_output.txt" >> $GITHUB_ENV

      - name: Run Lint and Capture Output
        if: github.event_name == 'pull_request'
        run: |
          {
            black --check --line-length 120 bin/ 2>&1 || true
            flake8 bin/ --max-line-length=120 --ignore=E203,W503 2>&1 || true
          } | tee /tmp/lint_output.txt
          echo "LINT_OUTPUT_FILE=/tmp/lint_output.txt" >> $GITHUB_ENV

      - name: Run Lessons Learned Analysis
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.scan_only }}" = "true" ]; then
            python bin/lessons_learned.py --scan
          elif [ -n "${DIFF_FILE:-}" ]; then
            python bin/lessons_learned.py \
              --pr-number "${PR_NUMBER:-unknown}" \
              --diff-file "${DIFF_FILE}" \
              --test-output-file "${TEST_OUTPUT_FILE:-}" \
              --lint-output-file "${LINT_OUTPUT_FILE:-}" 
          else
            python bin/lessons_learned.py --scan
          fi

      - name: Commit Lessons Learned Updates
        run: |
          TARGET_BRANCH="${{ github.event.pull_request.base.ref || 'main' }}"
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add lessons_learned.json || true
          if git diff --staged --quiet; then
            echo "No lessons learned updates to commit"
          else
            git commit -m "chore: update lessons learned from PR #${PR_NUMBER:-manual}"
            git push origin "HEAD:${TARGET_BRANCH}" || true
          fi
