name: Build and Publish Docker Images

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

# Prevent concurrent builds on main from racing (e.g. lessons-learned push).
# Queue new runs instead of cancelling in-progress ones.
concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  # Auto-bump patch version on pushes to main when version wasn't manually bumped.
  # This ensures HA Supervisor always detects new builds as updates.
  # When auto-bump pushes a new commit, it sets bumped=true to skip build in THIS run;
  # the pushed commit triggers a SECOND run that will build with the new version.
  auto-version-bump:
    name: Auto-bump Add-on Version
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      bumped: ${{ steps.bump.outputs.bumped }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if version was already bumped in this push
        id: bump
        run: |
          # Check if config.yaml version line changed in the latest commit
          if git diff HEAD~1 HEAD -- ha_ai_workflow_addon/config.yaml 2>/dev/null | grep -q '^[+-]version:'; then
            echo "✓ Version was already bumped in this commit — proceeding to build"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          else
            echo "→ Version was NOT bumped — auto-incrementing patch version"

            # Extract current version
            CURRENT=$(grep '^version:' ha_ai_workflow_addon/config.yaml | head -n1 | sed 's/version:[[:space:]]*"\{0,1\}\([^"]*\)"\{0,1\}/\1/' | tr -d '[:space:]')
            if [ -z "$CURRENT" ]; then
              echo "::error::Could not extract version from config.yaml"
              exit 1
            fi
            echo "  Current version: ${CURRENT}"

            # Split into major.minor.patch and increment patch
            MAJOR=$(echo "$CURRENT" | cut -d. -f1)
            MINOR=$(echo "$CURRENT" | cut -d. -f2)
            PATCH=$(echo "$CURRENT" | cut -d. -f3)
            NEW_PATCH=$((PATCH + 1))
            NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
            echo "  New version: ${NEW_VERSION}"

            # Update config.yaml
            sed -i "s/^version: .*/version: \"${NEW_VERSION}\"/" ha_ai_workflow_addon/config.yaml
            echo "✓ Updated config.yaml to version ${NEW_VERSION}"

            # Commit and push — this triggers a second workflow run that will build
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git add ha_ai_workflow_addon/config.yaml
            git commit -m "chore: auto-bump add-on version to ${NEW_VERSION}"
            git push
            echo "✓ Pushed version bump commit"
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          fi

  # Validate add-on configuration before building
  validate:
    name: Validate Add-on Configuration
    runs-on: ubuntu-latest
    needs: auto-version-bump
    # Run validation when auto-bump didn't push a new commit (to avoid double build),
    # OR on PRs/tags/manual triggers where auto-bump is skipped entirely.
    if: |
      always() &&
      (needs.auto-version-bump.result == 'skipped' || needs.auto-version-bump.outputs.bumped == 'false')
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Extract and verify version
        id: version
        run: |
          # Extract version from config.yaml (source of truth for HA add-on version)
          VERSION=$(grep '^version:' ha_ai_workflow_addon/config.yaml | head -n1 | sed 's/version:[[:space:]]*"\{0,1\}\([^"]*\)"\{0,1\}/\1/' | tr -d '[:space:]')
          if [ -z "$VERSION" ]; then
            echo "::error::Could not extract version from ha_ai_workflow_addon/config.yaml"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "✓ Add-on version: ${VERSION}"

      - name: Validate config.yaml
        run: |
          echo "Checking required fields in config.yaml..."
          for field in name version slug description arch image; do
            if ! grep -q "^${field}:" ha_ai_workflow_addon/config.yaml; then
              echo "::error::Missing required field '${field}' in config.yaml"
              exit 1
            fi
          done
          echo "✓ config.yaml has all required fields"

      - name: Validate build.yaml
        run: |
          echo "Checking build.yaml..."
          if [ ! -f ha_ai_workflow_addon/build.yaml ]; then
            echo "::error::build.yaml not found"
            exit 1
          fi
          echo "✓ build.yaml exists"

      - name: Validate Dockerfile
        run: |
          echo "Checking Dockerfile..."
          if [ ! -f ha_ai_workflow_addon/Dockerfile ]; then
            echo "::error::Dockerfile not found"
            exit 1
          fi
          # Verify ARG BUILD_FROM and FROM are present
          if ! grep -q 'ARG BUILD_FROM' ha_ai_workflow_addon/Dockerfile; then
            echo "::error::Dockerfile missing ARG BUILD_FROM"
            exit 1
          fi
          echo "✓ Dockerfile is valid"

      - name: Validate image name consistency
        run: |
          # Ensure config.yaml image field matches the expected pattern
          IMAGE_LINE=$(grep '^image:' ha_ai_workflow_addon/config.yaml || true)
          if [ -z "$IMAGE_LINE" ]; then
            echo "::error::No image field in config.yaml - required for HA update detection"
            exit 1
          fi
          echo "✓ Image field: ${IMAGE_LINE}"

  # Build using the official Home Assistant builder
  build:
    name: Build and Publish Add-on
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Stage files into add-on build context
        run: |
          # The HA builder uses --target directory as Docker build context.
          # Copy files that live at repo root into the add-on directory
          # so the Dockerfile can COPY them.
          echo "Staging files into ha_ai_workflow_addon/ build context..."
          cp requirements.txt ha_ai_workflow_addon/
          cp -r bin/ ha_ai_workflow_addon/bin/
          cp -r config/ ha_ai_workflow_addon/config/
          cp -r templates/ ha_ai_workflow_addon/templates/
          echo "✓ Files staged successfully"
          echo "Build context contents:"
          ls -la ha_ai_workflow_addon/

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push add-on
        uses: home-assistant/builder@2025.11.0
        with:
          args: |
            ${{ github.event_name == 'pull_request' && '--test' || '' }} \
            --amd64 \
            --aarch64 \
            --target ha_ai_workflow_addon \
            --docker-hub ghcr.io/balkonsen \
            --self-cache
